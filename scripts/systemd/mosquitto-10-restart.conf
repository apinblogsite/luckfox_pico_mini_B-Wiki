# Pasang sebagai /etc/systemd/system/mosquitto.service.d/10-restart.conf
#
# Unit bawaan distro sudah memakai Restart=on-failure, tapi dengan RestartSec
# bawaan 100 ms. Kombinasi itu berbahaya: kalau mosquitto gagal berulang saat
# start, jatah 5 percobaan habis dalam kurang dari satu detik dan systemd
# menyerah PERMANEN. Justru pada kegagalan yang paling perlu ditolong,
# kebijakan bawaan paling cepat menyerah.
#
# Restart=always juga menangkap kasus mosquitto keluar dengan status 0 secara
# tak terduga, yang tidak tertangkap on-failure.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
