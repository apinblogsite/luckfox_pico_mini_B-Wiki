# Pasang sebagai /etc/systemd/system/luckfox-wifi.service.d/10-restart.conf
#
# Unit ini Type=oneshot dengan RemainAfterExit=yes. Restart=on-failure di sini
# mencoba ulang START yang gagal -- ini menutup lubang terbesar: kalau dongle
# belum terenumerasi atau asosiasi gagal saat boot, board tidak lagi berakhir
# tanpa jaringan sama sekali.
#
# PRASYARAT: skrip harus mengembalikan kode keluar yang jujur. Versi pertama
# luckfox-wifi-up.sh keluar 0 untuk "tidak ada interface" dan untuk asosiasi
# gagal, sehingga Restart=on-failure tidak akan pernah terpicu. Kebijakan ini
# tidak ada gunanya tanpa perbaikan itu.
#
# BATASNYA: ini hanya menangani START yang gagal. Kalau WiFi terputus SETELAH
# unit sukses, systemd tidak tahu apa-apa -- prosesnya sudah selesai dengan
# status 0. Untuk itu dibutuhkan pemeriksa berkala, bukan kebijakan restart.

[Unit]
# Matikan pembatasan laju bawaan (5 start per 10 detik). Jaringan adalah
# satu-satunya jalur akses jarak jauh ke board ini, jadi lebih baik ia mencoba
# selamanya daripada menyerah permanen setelah lima percobaan.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
# ExecStartPre unit ini sendiri sudah menunggu 15 detik, jadi satu siklus
# percobaan memakan sekitar 35 detik.
RestartSec=20
