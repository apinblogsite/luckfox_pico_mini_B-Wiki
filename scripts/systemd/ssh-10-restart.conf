# Pasang sebagai /etc/systemd/system/ssh.service.d/10-restart.conf
#
# sshd adalah jalur akses utama ke board, jadi ia tidak boleh menyerah
# permanen. Masalahnya sama dengan mosquitto: unit bawaan memakai RestartSec
# bawaan 100 ms, sehingga jatah 5 percobaan habis dalam kurang dari sedetik.
#
# Restart=on-failure sengaja DIPERTAHANKAN, tidak dinaikkan ke always, karena
# unit bawaan memasang RestartPreventExitStatus=255 -- kode keluar sshd untuk
# konfigurasi rusak. Mengulang start dengan konfigurasi rusak hanya
# menghasilkan loop tanpa guna, dan lebih baik dibiarkan gagal supaya terlihat.

[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=5
