# Pasang di board sebagai /etc/NetworkManager/conf.d/99-unmanage-wifi.conf
#
# Jauhkan NetworkManager dari perangkat WiFi. WiFi ditangani wpa_supplicant
# langsung lewat luckfox-wifi.service.
#
# Wajib bila memakai driver staging r8188eu: NM memaksa jalur nl80211 yang
# tidak didukung driver berbasis WEXT itu, dan memicu kernel Oops.
# Dengan driver aircrack-ng ini tidak lagi wajib, tapi tetap disarankan agar
# hanya ada satu pihak yang mengelola interface.
[keyfile]
unmanaged-devices=type:wifi
