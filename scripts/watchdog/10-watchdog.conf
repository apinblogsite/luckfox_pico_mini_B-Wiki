# Pasang di board sebagai /etc/systemd/system.conf.d/10-watchdog.conf
#
# Header [Manager] itu WAJIB. Tanpa header seksi, systemd membaca berkasnya
# lalu membuang setiap barisnya dengan pesan yang mudah terlewat:
#   /etc/systemd/system.conf.d/10-watchdog.conf:8: Assignment outside of
#   section. Ignoring.
# dan RuntimeWatchdogUSec tetap 0 tanpa gejala lain.
#
# Menerapkannya HARUS lewat reboot, bukan `systemctl daemon-reexec`. Di board
# ini daemon-reexec selalu ditolak:
#   Refusing to reexecute, not enough space available on /run/systemd.
#   Currently, 5.8M are free, but a safety buffer of 16.0M is enforced.
# /run adalah tmpfs berukuran 8,3 MB (proporsional terhadap RAM 42 MB), jadi
# syarat 16 MB itu tidak akan pernah terpenuhi.

[Manager]
# Waktu tunggu perangkat keras. systemd (PID 1) memberi makan watchdog setiap
# setengah nilai ini. Kalau PID 1 tidak terjadwal selama itu -- kernel macet,
# atau CPU dikuasai proses lain sepenuhnya -- SoC melakukan reset perangkat
# keras tanpa perlu campur tangan manusia.
#
# Perangkat keras hanya menerima nilai berjenjang pangkat dua dari pencacah DW.
# Terukur pada board ini: 5, 11, 22, 44, 89 detik. Permintaan di antaranya
# dibulatkan ke atas (minta 30 -> dapat 44). Nilai di atas 89 dilaporkan apa
# adanya, yang mengesankan perpanjangan lewat perangkat lunak dan karena itu
# kurang bisa dipercaya untuk menangkap macet keras.
#
# 44 detik dipilih karena native dan memberi jarak aman: pemberian makan tiap
# 22 detik, sementara PID 1 yang sehat menjawab dalam hitungan milidetik.
RuntimeWatchdogSec=44s

# Menangkap proses shutdown/reboot yang menggantung.
RebootWatchdogSec=60s
